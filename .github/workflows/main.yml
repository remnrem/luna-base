name: lunabase CI

on:
  push:
    branches: [master, luna-2.0-dev]
    tags: v*
  pull_request:
    branches: [master, luna-2.0-dev]
    tags: v*
  workflow_dispatch:
    inputs:
      native_deps_mode:
        description: "Native dependency mode: all=rebuild, luna=use cache"
        required: false
        default: "luna"
        type: choice
        options:
          - luna
          - all
      release_version:
        description: "Optional release version to publish, e.g. v1.3.4"
        required: false
        default: ""
        type: string

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'
  FFTW_VERSION: 3.3.10
  LIGHTGBM_REF: v4.6.0
  ORT_REF: v1.29.0
  NATIVE_DEPS_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.native_deps_mode || 'luna' }}

jobs:
  release-meta:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.meta.outputs.enabled }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      title: ${{ steps.meta.outputs.title }}
    steps:
      - name: Resolve release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          INPUT_RELEASE_VERSION: ${{ github.event.inputs.release_version }}
        run: |
          version=""

          if [[ "${EVENT_NAME}" == "push" && "${GITHUB_REF_VALUE}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_VALUE#refs/tags/}"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_RELEASE_VERSION}" ]]; then
            version="${INPUT_RELEASE_VERSION}"
            if [[ "${version}" != v* ]]; then
              version="v${version}"
            fi
          fi

          if [[ -n "${version}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "version=${version}" >> "${GITHUB_OUTPUT}"
            echo "tag=${version}" >> "${GITHUB_OUTPUT}"
            echo "title=Luna ${version} release" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

  windows-build:
    needs: release-meta
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: zip mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-python git mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-fftw
      - name: Verify Windows toolchain
        id: windows-toolchain
        run: |
          test "$MSYSTEM" = UCRT64
          test "$MINGW_PREFIX" = /ucrt64
          ${MINGW_PREFIX}/bin/cmake.exe --version
          ${MINGW_PREFIX}/bin/mingw32-make.exe --version
          ${MINGW_PREFIX}/bin/gcc.exe --version
          ${MINGW_PREFIX}/bin/g++.exe --version
          python3 - <<'PYTHON'
          import hashlib, os, shutil, subprocess
          identity = os.environ['MSYSTEM'].encode() + os.environ['MINGW_PREFIX'].encode()
          identity += shutil.which('g++').encode()
          identity += subprocess.check_output(['g++', '--version'])
          identity += subprocess.check_output(['g++', '-dumpmachine'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('key=' + hashlib.sha256(identity).hexdigest()[:20] + '\n')
          PYTHON
      - name: Cache native deps
        id: cache-native
        uses: actions/cache@v5
        with:
          path: .ci-deps/windows-native
          key: native-deps-${{ runner.os }}-${{ runner.arch }}-ucrt64-v1-${{ steps.windows-toolchain.outputs.key }}-fftw-${{ env.FFTW_VERSION }}-lgbm-${{ env.LIGHTGBM_REF }}
      - name: Native deps cache status
        run: |
          echo "NATIVE_DEPS_MODE=${NATIVE_DEPS_MODE}"
          echo "cache-hit=${{ steps.cache-native.outputs.cache-hit }}"
      - name: Prepare FFTW bundle
        if: env.NATIVE_DEPS_MODE == 'all' || steps.cache-native.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci-deps/windows-native/fftw/include
          mkdir -p .ci-deps/windows-native/fftw/lib
          mkdir -p .ci-deps/windows-native/fftw/bin
          cp ${MINGW_PREFIX}/include/fftw3.h .ci-deps/windows-native/fftw/include/
          cp ${MINGW_PREFIX}/lib/libfftw3.dll.a .ci-deps/windows-native/fftw/lib/libfftw3.a
          cp ${MINGW_PREFIX}/bin/libfftw3-3.dll .ci-deps/windows-native/fftw/bin/
      - name: Build LightGBM
        if: env.NATIVE_DEPS_MODE == 'all' || steps.cache-native.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci-deps/windows-native
          cd .ci-deps/windows-native
          rm -rf LightGBM
          git clone --recursive --branch ${LIGHTGBM_REF} --depth 1 https://github.com/microsoft/LightGBM
          cd LightGBM
          mkdir build
          cd build
          ${MINGW_PREFIX}/bin/cmake.exe -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release ..
          mingw32-make.exe -j4
      - name: Build pinned DuckDB
        id: duckdb
        uses: ./.github/actions/duckdb
        with:
          shell: msys2 {0}
          rebuild: ${{ env.NATIVE_DEPS_MODE == 'all' }}
      - run: |
          mingw32-make.exe -j${NUMBER_OF_PROCESSORS:-4} ARCH=WINDOWS DUCKDB=1 DUCKDB_PATH=.ci-deps/duckdb LGBM=1 LGBM_PATH=.ci-deps/windows-native/LightGBM FFTW=.ci-deps/windows-native/fftw
          cp ".ci-deps/windows-native/fftw/bin/libfftw3-3.dll" .
          cp ".ci-deps/windows-native/LightGBM/lib_lightgbm.dll" .
          python3 scripts/ci/check_duckdb.py --library "${{ steps.duckdb.outputs.library }}"
          v="${{ needs.release-meta.outputs.version }}"
          v="${v:-dev}"
          mkdir luna-${v}
          cp luna.exe destrat.exe destrat-sqlite.exe behead.exe .ci-deps/windows-native/fftw/bin/libfftw3-3.dll .ci-deps/windows-native/LightGBM/lib_lightgbm.dll ${MINGW_PREFIX}/bin/libgcc_s_seh-1.dll ${MINGW_PREFIX}/bin/libstdc++-6.dll ${MINGW_PREFIX}/bin/libgomp-1.dll ${MINGW_PREFIX}/bin/libwinpthread-1.dll luna-${v}/
          cp .ci-deps/duckdb/DUCKDB-LICENSE .ci-deps/duckdb/DUCKDB-THIRD-PARTY-NOTICES.txt .ci-deps/duckdb/manifest.json luna-${v}/
          zip -r win-luna.zip luna-${v}
          python3 scripts/ci/check_duckdb.py --archive win-luna.zip --library "${{ steps.duckdb.outputs.library }}"
      - uses: actions/upload-artifact@v6
        with:
          name: win-luna.zip
          path: ./win-luna.zip
  macos-build:
    needs: release-meta
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - name: Cache native deps
        id: cache-native
        uses: actions/cache@v5
        with:
          path: |
            ~/LightGBM
            ~/fftw-${{ env.FFTW_VERSION }}
            ~/onnxruntime/dist/cpu-shared
          key: native-deps-${{ runner.os }}-${{ runner.arch }}-fftw-${{ env.FFTW_VERSION }}-lgbm-${{ env.LIGHTGBM_REF }}-ort-${{ env.ORT_REF }}-static-omp-off-v2
      - name: Native deps cache status
        run: |
          echo "NATIVE_DEPS_MODE=${NATIVE_DEPS_MODE}"
          echo "cache-hit=${{ steps.cache-native.outputs.cache-hit }}"
      - name: Install build tools for native dependencies
        if: env.NATIVE_DEPS_MODE == 'all' || steps.cache-native.outputs.cache-hit != 'true'
        run: |
          command -v cmake >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake
      - name: Install LightGBM
        if: env.NATIVE_DEPS_MODE == 'all' || steps.cache-native.outputs.cache-hit != 'true'
        run: |
          cd ${HOME}
          rm -rf LightGBM
          git clone --recursive --branch ${LIGHTGBM_REF} --depth 1 https://github.com/microsoft/LightGBM 
          cd LightGBM
          mkdir -p build && cd build
          cmake -DBUILD_STATIC_LIB=ON -DUSE_OPENMP=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_BUILD_TYPE=Release ..
          make -j4
      - name: Install fftw
        if: env.NATIVE_DEPS_MODE == 'all' || steps.cache-native.outputs.cache-hit != 'true'
        run: |
          cd $HOME
          rm -rf fftw-${FFTW_VERSION}
          rm -rf fftw-${FFTW_VERSION}.tar.gz
          curl -L -o fftw-${FFTW_VERSION}.tar.gz http://www.fftw.org/fftw-${FFTW_VERSION}.tar.gz
          tar -xzvf fftw-${FFTW_VERSION}.tar.gz
          cd fftw-${FFTW_VERSION}
          ./configure --disable-shared --enable-static --with-pic --prefix=${HOME}/fftw-${FFTW_VERSION}/
          make -j$(sysctl -n hw.ncpu)
          make install
          cd ${GITHUB_WORKSPACE}
      # ONNX Runtime is temporarily disabled for macOS CI. Restore this step
      # and ORT=1 in the Make step when ONNX support is enabled again.
      # - name: Build ONNX Runtime
      #   if: env.NATIVE_DEPS_MODE == 'all' || steps.cache-native.outputs.cache-hit != 'true'
      #   run: ...
      - name: Build pinned DuckDB
        id: duckdb
        uses: ./.github/actions/duckdb
        with:
          rebuild: ${{ env.NATIVE_DEPS_MODE == 'all' }}
      - name: Make
        run: |
          make -j$(sysctl -n hw.ncpu) ARCH=MAC DUCKDB=1 DUCKDB_PATH=.ci-deps/duckdb FFTW=${HOME}/fftw-${FFTW_VERSION} LGBM=1 LGBM_LINK=static LGBM_PATH=${HOME}/LightGBM ORT=0
          ./luna __LUNA_TESTS__ lgbm verbose
          python3 scripts/ci/check_duckdb.py --static-lightgbm --library "${{ steps.duckdb.outputs.library }}"
          v="${{ needs.release-meta.outputs.version }}"
          v="${v:-dev}"
          mkdir luna-${v}
          cp luna destrat destrat-sqlite behead luna-${v}/
          python3 scripts/ci/test_bundle_macos.py
          python3 scripts/ci/bundle_macos.py "luna-${v}" --search-dir "${HOME}/LightGBM" --search-dir "${HOME}/LightGBM/lib"
          cp "${HOME}/LightGBM/LICENSE" "luna-${v}/LIGHTGBM-LICENSE"
          cp "${HOME}/fftw-${FFTW_VERSION}/COPYING" "luna-${v}/FFTW-LICENSE"
          cd luna-${v}/
          otool -l ./luna
          cd ..
          cp .ci-deps/duckdb/DUCKDB-LICENSE .ci-deps/duckdb/DUCKDB-THIRD-PARTY-NOTICES.txt .ci-deps/duckdb/manifest.json luna-${v}/
          tar cvzf mac-luna.tar.gz luna-${v}/
          python3 scripts/ci/check_duckdb.py --static-lightgbm --archive mac-luna.tar.gz --library "${{ steps.duckdb.outputs.library }}"
      - uses: actions/upload-artifact@v6
        with:
          name: mac-luna.tar.gz
          path: mac-luna.tar.gz
          
  macos-arm64-build:
      needs: release-meta
      runs-on: macos-15
      steps:
      - uses: actions/checkout@v5
      - name: Cache native deps
        id: cache-native
        uses: actions/cache@v5
        with:
          path: |
            ~/LightGBM
            ~/fftw-${{ env.FFTW_VERSION }}
            ~/onnxruntime/dist/cpu-shared
          key: native-deps-${{ runner.os }}-${{ runner.arch }}-fftw-${{ env.FFTW_VERSION }}-lgbm-${{ env.LIGHTGBM_REF }}-ort-${{ env.ORT_REF }}-static-omp-off-v2
      - name: Native deps cache status
        run: |
          echo "NATIVE_DEPS_MODE=${NATIVE_DEPS_MODE}"
          echo "cache-hit=${{ steps.cache-native.outputs.cache-hit }}"

      - name: Install CMake for native dependencies
        if: env.NATIVE_DEPS_MODE == 'all' || steps.cache-native.outputs.cache-hit != 'true'
        run: |
          command -v cmake >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake

      - name: Clone and build LightGBM
        if: env.NATIVE_DEPS_MODE == 'all' || steps.cache-native.outputs.cache-hit != 'true'
        run: |
          cd ${HOME}
          rm -rf LightGBM
          git clone --recursive --branch ${LIGHTGBM_REF} --depth 1 https://github.com/microsoft/LightGBM
          cd LightGBM
          mkdir -p build && cd build
          cmake -DBUILD_STATIC_LIB=ON -DUSE_OPENMP=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_BUILD_TYPE=Release ..
          make -j4
          
      - name: Build FFTW
        if: env.NATIVE_DEPS_MODE == 'all' || steps.cache-native.outputs.cache-hit != 'true'
        run: |
          cd ${HOME}
          rm -rf fftw-${FFTW_VERSION}
          rm -rf fftw-${FFTW_VERSION}.tar.gz
          curl -L -o fftw-${FFTW_VERSION}.tar.gz http://www.fftw.org/fftw-${FFTW_VERSION}.tar.gz
          tar -xzvf fftw-${FFTW_VERSION}.tar.gz
          cd fftw-${FFTW_VERSION}
          ./configure --disable-shared --enable-static --with-pic --prefix=$HOME/fftw-${FFTW_VERSION} CFLAGS="-arch arm64"
          make -j$(sysctl -n hw.ncpu)
          make install
      # ONNX Runtime source build is paused on macOS; see the Intel job above.
    
      - name: Build pinned DuckDB
        id: duckdb
        uses: ./.github/actions/duckdb
        with:
          rebuild: ${{ env.NATIVE_DEPS_MODE == 'all' }}
      - name: Final Build
        run: |
          make -j$(sysctl -n hw.ncpu) ARCH=MAC DUCKDB=1 DUCKDB_PATH=.ci-deps/duckdb LGBM=1 LGBM_LINK=static LGBM_PATH=${HOME}/LightGBM/ FFTW=$HOME/fftw-${FFTW_VERSION} ORT=0
          ./luna __LUNA_TESTS__ lgbm verbose
          python3 scripts/ci/check_duckdb.py --static-lightgbm --library "${{ steps.duckdb.outputs.library }}"
          v="${{ needs.release-meta.outputs.version }}"
          v="${v:-dev}"
          mkdir luna-${v}
          cp luna destrat destrat-sqlite behead luna-${v}/
          python3 scripts/ci/test_bundle_macos.py
          python3 scripts/ci/bundle_macos.py "luna-${v}" --search-dir "${HOME}/LightGBM" --search-dir "${HOME}/LightGBM/lib"
          cp "${HOME}/LightGBM/LICENSE" "luna-${v}/LIGHTGBM-LICENSE"
          cp "${HOME}/fftw-${FFTW_VERSION}/COPYING" "luna-${v}/FFTW-LICENSE"
          cd luna-${v}/
          otool -L ./luna
          cd ..
          cp .ci-deps/duckdb/DUCKDB-LICENSE .ci-deps/duckdb/DUCKDB-THIRD-PARTY-NOTICES.txt .ci-deps/duckdb/manifest.json luna-${v}/
          tar cvzf macos-arm64-luna.tar.gz luna-${v}/
          python3 scripts/ci/check_duckdb.py --static-lightgbm --archive macos-arm64-luna.tar.gz --library "${{ steps.duckdb.outputs.library }}"
    
      - uses: actions/upload-artifact@v6
        with:
          name: macos-arm64-luna.tar.gz
          path: macos-arm64-luna.tar.gz
          
  linux-build:
    needs: release-meta
    runs-on: ubuntu-latest
    env:
      LINUX_BUILD_IMAGE: quay.io/pypa/manylinux_2_28_x86_64:latest
    steps:
      - uses: actions/checkout@v5
      # Keep Node-based actions on the host; compile and test only in the old-glibc container.
      - name: Resolve Linux build image
        id: linux-image
        run: |
          docker pull "$LINUX_BUILD_IMAGE"
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' "$LINUX_BUILD_IMAGE")
          identity=$(docker image inspect --format '{{.Id}}' "$LINUX_BUILD_IMAGE")
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "key=${identity#sha256:}" >> "$GITHUB_OUTPUT"
      - name: Cache baseline-compatible native dependencies
        id: cache-native
        uses: actions/cache@v5
        with:
          path: .ci-deps/linux-manylinux228
          key: linux-manylinux228-v1-${{ runner.arch }}-${{ steps.linux-image.outputs.key }}-fftw-${{ env.FFTW_VERSION }}-lgbm-${{ env.LIGHTGBM_REF }}-${{ hashFiles('scripts/ci/build_linux_portable.sh', 'scripts/ci/build_duckdb.py') }}
      - name: Build and test portable Linux binaries
        env:
          LINUX_BUILD_IMAGE: ${{ steps.linux-image.outputs.image }}
          LUNA_PACKAGE_VERSION: ${{ needs.release-meta.outputs.version || 'dev' }}
        run: |
          echo "Native deps cache hit: ${{ steps.cache-native.outputs.cache-hit }}"
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            --env HOME=/tmp/luna-build-home --env CCACHE_DISABLE=1 \
            --env FFTW_VERSION --env LIGHTGBM_REF --env NATIVE_DEPS_MODE \
            --env PYTHONIOENCODING --env PYTHONUTF8 \
            --env LINUX_BUILD_IMAGE --env LUNA_PACKAGE_VERSION \
            "$LINUX_BUILD_IMAGE" bash scripts/ci/build_linux_portable.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-luna.tar.gz
          path: linux-luna.tar.gz
          archive: false
          if-no-files-found: error
  release:
    runs-on: ubuntu-latest
    needs: [release-meta, linux-build, macos-build, windows-build, macos-arm64-build]
    if: needs.release-meta.outputs.enabled == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        id: download
        with:
          path: .
      - run: |
          echo ${{steps.download.outputs.download-path}}
          cd ${{steps.download.outputs.download-path}}
          mv linux-luna.tar.gz/linux-luna.tar.gz linux_luna.tar.gz
          mv mac-luna.tar.gz/mac-luna.tar.gz mac_luna.tar.gz
          mv win-luna.zip/win-luna.zip win_luna.zip
          mv macos-arm64-luna.tar.gz/macos-arm64-luna.tar.gz macos_arm64_luna.tar.gz
          
      - name: Publish Release
        id: publish-release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.release-meta.outputs.tag }}
          commit: ${{ github.sha }}
          name: ${{ needs.release-meta.outputs.title }}
          artifacts: "linux_luna.tar.gz,mac_luna.tar.gz,macos_arm64_luna.tar.gz,win_luna.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: "false"
          prerelease: "false"
          allowUpdates: "true"
          replacesArtifacts: "true"
